<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Jobby ERP – Inicia sesión y gestiona tu negocio desde una sola vista clara.">
  <title>Jobby ERP - Iniciar sesión</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
    rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/brand.css">
</head>

<body class="auth-page">
  <main role="main">
    <div class="auth-card">
      <div class="auth-logo"><img src="logo.png" alt="Jobby" width="34" height="34"></div>
      <h1 class="auth-title">Bienvenido de nuevo</h1>
      <p class="auth-sub">Inicia sesión en tu Jobby ERP</p>

      <form class="auth-form" onsubmit="event.preventDefault(); window.location.href='pages/home.html';">
        <div class="form-group">
          <label for="login-email">Correo electrónico</label>
          <input type="email" id="login-email" class="brand-input" placeholder="nombre@empresa.com" autocomplete="email" required>
        </div>

        <div class="form-group">
          <div class="auth-label-row">
            <label for="login-password">Contraseña</label>
            <a class="auth-link" href="#" style="font-size: 0.76rem;">¿Olvidaste tu contraseña?</a>
          </div>
          <input type="password" id="login-password" class="brand-input" placeholder="••••••••" autocomplete="current-password" required>
        </div>

        <button type="submit" class="cta">Iniciar sesión</button>
      </form>

      <div class="auth-footer">
        ¿No tienes una cuenta? <a class="auth-link" href="pages/register.html">Crea tu empresa</a>
      </div>
    </div>
  </main>
</body>

</html>
