<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Jobby ERP – Crea la cuenta de tu empresa y empieza a facturar.">
  <title>Jobby ERP - Crea tu empresa</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
    rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/tokens.css">
  <link rel="stylesheet" href="../css/styles.css">
  <link rel="stylesheet" href="../css/brand.css">
</head>

<body class="auth-page">
  <main role="main">
    <div class="auth-card auth-card--wide">
      <div class="auth-logo" aria-hidden="true">J</div>
      <h1 class="auth-title">Crea tu empresa</h1>
      <p class="auth-sub">Configura tu perfil de administrador para comenzar</p>

      <form class="auth-form" onsubmit="event.preventDefault(); window.location.href='home.html';">
        <div class="form-row">
          <div class="form-group">
            <label for="reg-firstname">Nombre</label>
            <input type="text" id="reg-firstname" class="brand-input" placeholder="Ej. Juan" autocomplete="given-name" required>
          </div>
          <div class="form-group">
            <label for="reg-lastname">Apellido</label>
            <input type="text" id="reg-lastname" class="brand-input" placeholder="Ej. Díaz" autocomplete="family-name" required>
          </div>
        </div>

        <div class="form-group">
          <label for="reg-email">Correo electrónico</label>
          <input type="email" id="reg-email" class="brand-input" placeholder="nombre@empresa.com" autocomplete="email" required>
        </div>

        <div class="form-group">
          <label for="reg-phone">Número de teléfono</label>
          <input type="tel" id="reg-phone" class="brand-input" placeholder="+57 312 459 0501" autocomplete="tel" required>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="reg-password">Contraseña</label>
            <input type="password" id="reg-password" class="brand-input" placeholder="••••••••" autocomplete="new-password" required>
          </div>
          <div class="form-group">
            <label for="reg-confirm">Confirmar contraseña</label>
            <input type="password" id="reg-confirm" class="brand-input" placeholder="••••••••" autocomplete="new-password" required>
          </div>
        </div>

        <button type="submit" class="cta">Crear empresa</button>
      </form>

      <div class="auth-footer">
        ¿Ya tienes una cuenta? <a class="auth-link" href="../index.html">Inicia sesión</a>
      </div>
    </div>
  </main>
</body>

</html>
